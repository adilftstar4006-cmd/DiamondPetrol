.title{text-align:center;margin-bottom:20px;position:relative;z-index:1}

.nav button .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);transition:.3s;font-size:14px}
.nav button.active .ico{background:linear-gradient(135deg,#00d2ff,#7b2ff7);box-shadow:0 4px 12px rgba(123,47,247,.35);transform:scale(1.05)}
</style>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBqYWKUXYDo8y-X7kLCuzldF_UKVht04",
  authDomain: "adiimei-invest.firebaseapp.com",
  projectId: "adiimei-invest",
  storageBucket: "adiimei-invest.firebasestorage.app",
  messagingSenderId: "383621463567",
  appId: "1:383621463567:web:5993d2528bdb88b7ed7a",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser=null, unsub=null, currentDash='dashboard', isProcessing=false;
const PLANS=[
  {id:1,name:'Basic',price:5000,daily:200,total:3000},
  {id:2,name:'Starter',price:8000,daily:350,total:5250},
  {id:3,name:'Lite',price:12000,daily:550,total:8250},

];

function toast(msg,type='ok'){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast '+type;
  t.innerHTML=(type==='ok'?'✅ ':'⚠️ ')+msg;
  wrap.appendChild(t);
  setTimeout(()=>{t.style.transform='translateY(-10px) scale(.95)';t.style.opacity='0';setTimeout(()=>t.remove(),300)},2600);
}
function norm(p){if(!p)return'';p=p.trim().replace(/\s|-/g,'');if(p.startsWith('+92'))p='0'+p.slice(3);if(p.startsWith('92')&&p.length>=11)p='0'+p.slice(2);return p;}
function validPhone(p){return /^03[0-9]{9}$/.test(p);}
function switchTab(t){document.getElementById('loginForm').classList.toggle('active',t==='login');document.getElementById('signupForm').classList.toggle('active',t==='signup');showMsg('','');clearErrors();}
function showMsg(txt,type){const el=document.getElementById('msg');if(!txt){el.classList.remove('show');el.textContent='';return;}el.textContent=txt;el.className='msg show '+type;}
function clearErrors(){document.querySelectorAll('.field-error').forEach(e=>{e.classList.remove('show');e.textContent=''});document.querySelectorAll('.field-row').forEach(e=>e.classList.remove('error'));}
function showFieldError(rowId,errId,msg){document.getElementById(rowId)?.classList.add('error');const er=document.getElementById(errId);if(er){er.textContent=msg;er.classList.add('show');}}
function toggleEye(id,el){const inp=document.getElementById(id);if(inp.type==='password'){inp.type='text';el.textContent='🙈';}else{inp.type='password';el.textContent='👁️';}}
function setLoading(btnId,loading,text){const btn=document.getElementById(btnId);const txtEl=btn.querySelector('.btn-text');if(loading){btn.classList.add('loading');btn.disabled=true;isProcessing=true;txtEl.textContent='Please wait...';}else{btn.classList.remove('loading');btn.disabled=false;isProcessing=false;txtEl.textContent=text;}}
function switchDash(t){currentDash=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+t)?.classList.add('active');renderDash();}

async function doSignup(){
  if(isProcessing)return;
  clearErrors();
  const name=document.getElementById('signupName').value.trim();
  const raw=document.getElementById('signupPhone').value.trim();
  const pass=document.getElementById('signupPass').value;
  const ref=document.getElementById('signupRef').value.trim().toUpperCase();
  let hasError=false;
  if(!name||name.length<3){showFieldError('row-signupName','err-signupName','Name min 3 chars - adil');hasError=true;}
  const phone=norm(raw);
  if(!raw){showFieldError('row-signupPhone','err-signupPhone','Phone required');hasError=true;}
  else if(!validPhone(phone)){showFieldError('row-signupPhone','err-signupPhone','Format: 03313394007 (11 digits, 03 start)');hasError=true;}
  if(!pass){showFieldError('row-signupPass','err-signupPass','Password required');hasError=true;}
  else if(pass.length<6){showFieldError('row-signupPass','err-signupPass','Min 6 characters');hasError=true;}
  if(hasError){toast('Fix errors first','err');return;}
  setLoading('signupBtn',true);showMsg('Creating secure account...','ok');
  try{
    const doc=await db.collection('users').doc(phone).get();
    if(doc.exists){showMsg('Phone already registered → Please Login','err');toast('Already exists, login','err');setLoading('signupBtn',false,'CREATE ACCOUNT + Rs 500 BONUS');return;}
    const id=Date.now().toString();
    const code='DIAMOND'+phone.slice(-4)+Math.floor(Math.random()*90+10);
    const nu={id:id,phone:phone,username:name,email:phone+'@diamond.local',fullName:name,password:pass,referralCode:code,referredBy:ref,balance:500,totalDeposit:0,totalEarning:0,totalInvested:0,totalEarned:0,referralsCount:0,referralEarnings:0,kycStatus:'not_submitted',activeInvests:[],transactions:[{type:'bonus',amount:500,desc:'Welcome bonus Rs 500',date:new Date().toISOString()}],createdAt:new Date().toISOString(),lastSync:firebase.firestore.FieldValue.serverTimestamp()};

async function doLogin(){
  if(isProcessing)return;
  clearErrors();
  const raw=document.getElementById('loginPhone').value.trim();
  const pass=document.getElementById('loginPass').value;
  let hasError=false;
  if(!raw){showFieldError('row-loginPhone','err-loginPhone','Phone required');hasError=true;}
  const phone=norm(raw);
  if(raw && !validPhone(phone)){showFieldError('row-loginPhone','err-loginPhone','Format: 03313394007');hasError=true;}
  if(!pass){showFieldError('row-loginPass','err-loginPass','Password required');hasError=true;}
  if(hasError){toast('Fix errors','err');return;}
  setLoading('loginBtn',true);showMsg('Verifying securely...','ok');
  try{
    const doc=await db.collection('users').doc(phone).get();
    if(!doc.exists){showMsg('User not found → Signup first','err');toast('Not found, signup','err');setLoading('loginBtn',false,'LOGIN SECURELY');return;}
    const fb=doc.data();
    if(fb.password!==pass){showMsg('Wrong password','err');showFieldError('row-loginPass','err-loginPass','Wrong password');toast('Wrong password','err');setLoading('loginBtn',false,'LOGIN SECURELY');return;}
    localStorage.setItem('diamond_current_glass_v18',phone);
    localStorage.setItem('diamond_current_glass_fixed_v17',phone);
    localStorage.setItem('diamond_current_v4',fb.id||phone);
    if(document.getElementById('remember').checked){localStorage.setItem('diamond_remember',phone);} 
    currentUser=fb;
    toast('Welcome '+fb.fullName+'!','ok');showMsg('Welcome!','ok');setTimeout(()=>showDash(),600);
  }catch(e){showMsg(e.message,'err');toast(e.message,'err');setLoading('loginBtn',false,'LOGIN SECURELY');}
}

async function investPlan(amount,name,daily){
  if(isProcessing)return;
  if(currentUser.balance<amount){toast('Insufficient: Rs '+currentUser.balance,'err');return;}
  if(!confirm('Invest Rs '+amount+' in '+name+'? Daily Rs '+daily)){return;}
  isProcessing=true;
  try{
    const newBal=currentUser.balance-amount;
    const newInv=(currentUser.totalDeposit||0)+amount;
    const newActive=[...(currentUser.activeInvests||[]),{id:Date.now().toString(),userId:currentUser.id||currentUser.phone,planId:PLANS.find(p=>p.price===amount)?.id||1,planName:name,investAmount:amount,amount:amount,dailyProfit:daily,daily:daily,startDate:Date.now(),lastClaimDate:Date.now()-60000,totalClaimed:0,daysCompleted:0,status:'active'}];
    await db.collection('users').doc(currentUser.phone).update({balance:newBal,totalDeposit:newInv,totalInvested:newInv,activeInvests:newActive});
    currentUser.balance=newBal;currentUser.totalDeposit=newInv;currentUser.activeInvests=newActive;
    renderDash();toast('Invested Rs '+amount+' in '+name+' • Daily Rs '+daily,'ok');
  }catch(e){toast(e.message,'err');}finally{isProcessing=false;}
}

async function claimOne(id){
  if(isProcessing)return;
  const inv=currentUser.activeInvests.find(i=>i.id===id); if(!inv)return;
  isProcessing=true;
  try{
    const profit=inv.dailyProfit||inv.daily||0;
    const newBal=currentUser.balance+profit;
    const newEarn=(currentUser.totalEarning||0)+profit;
    const newActive=currentUser.activeInvests.map(i=>i.id===id?{...i,totalClaimed:(i.totalClaimed||0)+profit,daysCompleted:(i.daysCompleted||0)+1,lastClaimDate:Date.now()}:i);
    await db.collection('users').doc(currentUser.phone).update({balance:newBal,totalEarning:newEarn,totalEarned:newEarn,activeInvests:newActive});
    currentUser.balance=newBal;currentUser.totalEarning=newEarn;currentUser.activeInvests=newActive;
    renderDash();toast('Claimed Rs '+profit+' from '+inv.planName,'ok');
  }catch(e){toast(e.message,'err');}finally{isProcessing=false;}
}

function submitDeposit(){
  const amount=document.getElementById('depAmount')?.value;
  const name=document.getElementById('depName')?.value;
  if(!amount||!name){toast('Fill amount and name','err');return;}
  if(Number(amount)<500){toast('Min deposit Rs 500','err');return;}
  toast('Deposit Rs '+amount+' submitted • JazzCash 03134823393 • Pending approval','ok');
}

async function loadCurrent(){
  const phone=localStorage.getItem('diamond_current_glass_v18')||localStorage.getItem('diamond_current_glass_fixed_v17')||localStorage.getItem('diamond_current_glass_fixed');
  if(!phone)return;
  // fast local first
  try{
    const localUsers=JSON.parse(localStorage.getItem('diamond_users_v4')||'[]');
    const local=localUsers.find(u=>u.email===phone+'@diamond.local' || u.phone===phone);
    if(local){currentUser={...local,phone:phone,fullName:local.username||local.fullName,totalDeposit:local.totalDeposit||0,totalEarning:local.totalEarning||0,activeInvests:local.activeInvests||[]};showDash();}
  }catch(e){}
  // then firebase
  try{const doc=await db.collection('users').doc(phone).get(); if(doc.exists){currentUser=doc.data();showDash();}}catch(e){}
}

function startListener(){
  if(!currentUser||unsub)return;
  unsub=db.collection('users').doc(currentUser.phone).onSnapshot(snap=>{
    if(!snap.exists)return;
    const fb=snap.data();
    if(JSON.stringify(fb)!==JSON.stringify(currentUser)){
      currentUser=fb;renderDash();
    }
  });
}
function logout(){
  ['diamond_current_glass_v18','diamond_current_glass_fixed_v17','diamond_current_glass_fixed','diamond_current_v4'].forEach(k=>localStorage.removeItem(k));
  if(unsub){unsub();unsub=null;}location.reload();
}
