    <div class="orig-card"><div class="flex gap-3 items-center"><div class="w-11 h-11 rounded-xl bg-gradient-to-br from-[#00d2ff] to-[#7b2ff7] grid place-items-center font-extrabold text-[16px]">${(currentUser.fullName||'U')[0]}</div><div><div class="font-bold text-[13px]">${currentUser.fullName}</div><div class="text-[10px] text-white/50">${currentUser.phone} • ${currentUser.email}</div><div class="text-[9px] mt-1 px-2 py-0.5 rounded-full bg-white/5 inline-block">${currentUser.referralCode}</div></div></div><div class="grid grid-cols-3 gap-1.5 mt-4"><div class="bg-[#0a0e1f] rounded-[9px] p-2 text-center"><div class="text-[8px] text-white/40">Balance</div><div class="font-bold text-[11px]">Rs ${bal.toLocaleString()}</div></div><div class="bg-[#0a0e1f] rounded-[9px] p-2 text-center"><div class="text-[8px] text-white/40">Invested</div><div class="font-bold text-[11px]">Rs ${totalDep.toLocaleString()}</div></div><div class="bg-[#0a0e1f] rounded-[9px] p-2 text-center"><div class="text-[8px] text-white/40">Refs</div><div class="font-bold text-[11px]">${currentUser.referralsCount||0}</div></div></div></div>
    <div class="orig-card"><h3 class="text-[12px] font-bold mb-2">🔒 Security • Original UI v20</h3><div class="text-[10px] px-2.5 py-1.5 rounded-full bg-white/5 inline-block">KYC: ${(currentUser.kycStatus||'not_submitted').toUpperCase()} • Aviator Bal Rs ${avBal.toLocaleString()} • Original Video UI • Glass Login Fixed 0% Change</div><div class="mt-3 text-[10px] text-white/35">Login UI bilkul nahi chera - wohi glass fixed. Andar ka dashboard bilkul shuru wali video jaisa original dark #0a0e1f, cards #151a2f, plans with Invest & Return inside box.</div></div>
   </div>
  `;
 }
}
function calcWithdraw(){const a=Number(document.getElementById('wdAmount')?.value||0);const fee=Math.ceil(a*0.05);const rec=a-fee;const f=document.getElementById('wdFee');const r=document.getElementById('wdReceive');if(f)f.textContent='Rs '+fee.toLocaleString();if(r)r.textContent='Rs '+rec.toLocaleString();}
async function submitWithdraw(){
 const amount=Number(document.getElementById('wdAmount')?.value||0);const method=document.getElementById('wdMethod')?.value;const acc=document.getElementById('wdAccount')?.value.trim();const title=document.getElementById('wdTitle')?.value.trim();
 if(!amount||amount<500){toast('Min Rs 500','err');return;}if(amount>currentUser.balance){toast('Insufficient','err');return;}const accNorm=norm(acc);if(!validPhone(accNorm)){toast('Valid 03xxxxxxxxx','err');return;}if(!title||title.length<3){toast('Title required','err');return;}
 if((currentUser.kycStatus||'not_submitted')!=='approved'){toast('KYC required - submit KYC','err');switchDash('kyc');return;}
 if(!confirm('Withdraw Rs '+amount+' to '+accNorm+'?'))return;
 try{const fee=Math.ceil(amount*0.05);const receive=amount-fee;const wd={id:Date.now().toString(),amount:amount,fee:fee,receive:receive,method:method,account:accNorm,title:title,status:'pending',date:new Date().toISOString()};const newBal=currentUser.balance-amount;const newHist=[...(currentUser.withdrawHistory||[]),wd];await db.collection('users').doc(currentUser.phone).update({balance:newBal,withdrawHistory:newHist});currentUser.balance=newBal;currentUser.withdrawHistory=newHist;toast('Withdraw Rs '+amount+' requested • Pending','ok');renderDash();}catch(e){toast(e.message,'err');}
}
async function submitKyc(){
 const name=document.getElementById('kycName')?.value.trim();const cnic=document.getElementById('kycCnic')?.value.trim();const dob=document.getElementById('kycDob')?.value;const jazz=document.getElementById('kycJazz')?.value.trim();const addr=document.getElementById('kycAddr')?.value.trim();
 if(!name||name.length<3){toast('Name required','err');return;}if(!cnic||cnic.length<13){toast('CNIC required','err');return;}const jNorm=norm(jazz);if(!validPhone(jNorm)){toast('Valid JazzCash','err');return;}if(!dob){toast('DOB required','err');return;}if(!addr||addr.length<5){toast('Address required','err');return;}
 try{const kycData={name:name,cnic:cnic,dob:dob,jazz:jNorm,addr:addr,submittedAt:new Date().toISOString()};await db.collection('users').doc(currentUser.phone).update({kycStatus:'pending',kycData:kycData});currentUser.kycStatus='pending';currentUser.kycData=kycData;toast('KYC submitted • Pending 24h','ok');renderDash();}catch(e){toast(e.message,'err');}
}
let avGame={isFlying:false,mult:1.0,crash:0,bet:0,betPlaced:false,interval:null,planeX:20,planeY:40};
function initAviator(){avGame={isFlying:false,mult:1.0,crash:0,bet:0,betPlaced:false,interval:null,planeX:20,planeY:40};updateAvUI();}
function generateFairCrash(){const r=Math.random();let crash=0.97/(1-r*0.97);if(crash<1)crash=1+Math.random()*0.2;if(crash>50)crash=50+Math.random()*50;if(Math.random()<0.03)crash=1.00;return Math.round(crash*100)/100;}
function placeAviatorBet(){
 if(avGame.isFlying){toast('Already flying','err');return;}
 const bet=Number(document.getElementById('avBet')?.value||0);
 if(!bet||bet<10){toast('Min bet Rs 10','err');return;}if(bet>(currentUser.aviatorBalance||0)){toast('Insufficient aviator bal Rs '+(currentUser.aviatorBalance||0),'err');return;}if(bet>1000){toast('Max Rs 1000 demo','err');return;}
 const crash=generateFairCrash();
 avGame={isFlying:true,mult:1.0,crash:crash,bet:bet,betPlaced:true,planeX:20,planeY:40};
 document.getElementById('avBetBtn').disabled=true;document.getElementById('avBetBtn').textContent='FLYING...';document.getElementById('avCashBtn').disabled=false;document.getElementById('avCashBtn').style.background='linear-gradient(90deg,#34d399,#00d2ff)';document.getElementById('avCashBtn').style.color='#000';
 document.getElementById('avStatus').textContent='FLYING';
 currentUser.aviatorBalance=(currentUser.aviatorBalance||500)-bet;
 let start=Date.now();
 avGame.interval=setInterval(()=>{
  const elapsed=(Date.now()-start)/1000;
  avGame.mult=1+Math.pow(elapsed,1.15)*0.15;avGame.mult=Math.round(avGame.mult*100)/100;
  avGame.planeX=20+elapsed*35;avGame.planeY=40+elapsed*18;
  if(avGame.planeX>85)avGame.planeX=85;if(avGame.planeY>75)avGame.planeY=75;
  updateAvUI();
  const auto=Number(document.getElementById('avAuto')?.value||0);
  if(auto>=1.1&&avGame.mult>=auto&&avGame.betPlaced){cashoutAviator(true);}
  if(avGame.mult>=avGame.crash){crashAviator();}
 },80);
}
function updateAvUI(){
 const plane=document.getElementById('avPlane');const mult=document.getElementById('avMult');const line=document.getElementById('avLine');const info=document.getElementById('avInfo');
 if(!plane||!mult)return;
 plane.style.left=avGame.planeX+'%';plane.style.bottom=avGame.planeY+'px';
 mult.textContent=avGame.mult.toFixed(2)+'x';line.style.width=avGame.planeX+'%';
 if(avGame.isFlying){mult.className='text-[48px] font-black text-[#34d399]';if(info)info.textContent='Bet Rs '+avGame.bet+' • Crash random @ '+avGame.crash.toFixed(2)+'x (hidden) • Cashout before crash!';}
}
function cashoutAviator(isAuto=false){
 if(!avGame.isFlying||!avGame.betPlaced)return;
 clearInterval(avGame.interval);
 const win=Math.floor(avGame.bet*avGame.mult);const profit=win-avGame.bet;
 currentUser.aviatorBalance=(currentUser.aviatorBalance||0)+win;
 avGame.isFlying=false;avGame.betPlaced=false;
 const hist={crash:avGame.crash,bet:avGame.bet,mult:avGame.mult,win:win,profit:profit,won:true,time:Date.now()};
 currentUser.aviatorHistory=[...(currentUser.aviatorHistory||[]),hist].slice(-30);
 db.collection('users').doc(currentUser.phone).update({aviatorBalance:currentUser.aviatorBalance,aviatorHistory:currentUser.aviatorHistory}).catch(()=>{});
 document.getElementById('avBetBtn').disabled=false;document.getElementById('avBetBtn').textContent='PLACE BET • FLY ✈️';
 document.getElementById('avCashBtn').disabled=true;document.getElementById('avCashBtn').style.background='rgba(255,255,255,.05)';document.getElementById('avCashBtn').style.color='rgba(255,255,255,.3)';
 document.getElementById('avStatus').textContent='WON '+win+' @ '+avGame.mult.toFixed(2)+'x';
 document.getElementById('avInfo').textContent=(isAuto?'AUTO ':'')+'Cashout '+avGame.mult.toFixed(2)+'x • Win Rs '+win+' • Profit Rs '+profit;
 toast((isAuto?'Auto ':'')+'Cashout '+avGame.mult.toFixed(2)+'x • Win Rs '+win,'ok');renderDash();
 setTimeout(()=>{avGame.mult=1.0;avGame.planeX=20;avGame.planeY=40;updateAvUI();},1200);
}
function crashAviator(){
 clearInterval(avGame.interval);avGame.isFlying=false;avGame.betPlaced=false;
 const hist={crash:avGame.crash,bet:avGame.bet,mult:avGame.crash,win:0,profit:-avGame.bet,won:false,time:Date.now()};
 currentUser.aviatorHistory=[...(currentUser.aviatorHistory||[]),hist].slice(-30);
 db.collection('users').doc(currentUser.phone).update({aviatorBalance:currentUser.aviatorBalance,aviatorHistory:currentUser.aviatorHistory}).catch(()=>{});
 const m=document.getElementById('avMult');if(m){m.textContent=avGame.crash.toFixed(2)+'x';m.className='text-[48px] font-black text-red-400';}
 document.getElementById('avBetBtn').disabled=false;document.getElementById('avBetBtn').textContent='PLACE BET • FLY ✈️';
 document.getElementById('avCashBtn').disabled=true;document.getElementById('avCashBtn').style.background='rgba(255,255,255,.05)';document.getElementById('avCashBtn').style.color='rgba(255,255,255,.3)';
 document.getElementById('avStatus').textContent='CRASHED @ '+avGame.crash.toFixed(2)+'x';
 document.getElementById('avInfo').textContent='💥 CRASHED @ '+avGame.crash.toFixed(2)+'x • Lost Rs '+avGame.bet+' • Fair RNG';
 toast('Crashed @ '+avGame.crash.toFixed(2)+'x • Lost Rs '+avGame.bet,'err');renderDash();
 setTimeout(()=>{avGame.mult=1.0;avGame.planeX=20;avGame.planeY=40;updateAvUI();},1500);
}
async function investPlan(a,n,d){if(isProcessing)return;if(currentUser.balance<a){toast('Insufficient Rs '+currentUser.balance,'err');return;}if(!confirm('Invest Rs '+a+' in '+n+'? Daily Rs '+d))return;isProcessing=true;try{const nb=currentUser.balance-a;const ni=(currentUser.totalDeposit||0)+a;const na=[...(currentUser.activeInvests||[]),{id:Date.now().toString(),planId:PLANS.find(p=>p.price===a)?.id||1,planName:n,investAmount:a,amount:a,dailyProfit:d,daily:d,startDate:Date.now(),lastClaimDate:Date.now()-60000,totalClaimed:0,daysCompleted:0,status:'active'}];await db.collection('users').doc(currentUser.phone).update({balance:nb,totalDeposit:ni,totalInvested:ni,activeInvests:na});currentUser.balance=nb;currentUser.totalDeposit=ni;currentUser.activeInvests=na;renderDash();toast('Invested Rs '+a+' in '+n,'ok');}catch(e){toast(e.message,'err');}finally{isProcessing=false;}}
async function claimOne(id){if(isProcessing)return;const inv=currentUser.activeInvests.find(i=>i.id===id);if(!inv)return;isProcessing=true;try{const p=inv.dailyProfit||inv.daily||0;const nb=currentUser.balance+p;const ne=(currentUser.totalEarning||0)+p;const na=currentUser.activeInvests.map(i=>i.id===id?{...i,totalClaimed:(i.totalClaimed||0)+p,daysCompleted:(i.daysCompleted||0)+1,lastClaimDate:Date.now()}:i);await db.collection('users').doc(currentUser.phone).update({balance:nb,totalEarning:ne,totalEarned:ne,activeInvests:na});currentUser.balance=nb;currentUser.totalEarning=ne;currentUser.activeInvests=na;renderDash();toast('Claimed Rs '+p,'ok');}catch(e){toast(e.message,'err');}finally{isProcessing=false;}}
function submitDeposit(){const a=document.getElementById('depAmount')?.value;const n=document.getElementById('depName')?.value;if(!a||!n){toast('Fill amount and name','err');return;}if(Number(a)<500){toast('Min 500','err');return;}toast('Deposit Rs '+a+' submitted • JazzCash 03134823393 • Pending','ok');}
async function loadCurrent(){const p=localStorage.getItem('diamond_current_glass_v20')||localStorage.getItem('diamond_current_glass_v19')||localStorage.getItem('diamond_current_glass_v18')||localStorage.getItem('diamond_current_glass_fixed_v17');if(!p)return;try{const lu=JSON.parse(localStorage.getItem('diamond_users_v4')||'[]');const l=lu.find(u=>u.email===p+'@diamond.local'||u.phone===p);if(l){currentUser={...l,phone:p,fullName:l.username||l.fullName,totalDeposit:l.totalDeposit||0,totalEarning:l.totalEarning||0,activeInvests:l.activeInvests||[],aviatorBalance:500,aviatorHistory:[],withdrawHistory:[],kycStatus:l.kycStatus||'not_submitted'};showDash();}}catch(e){}try{const d=await db.collection('users').doc(p).get();if(d.exists){currentUser=d.data();if(currentUser.aviatorBalance===undefined)currentUser.aviatorBalance=500;if(!currentUser.withdrawHistory)currentUser.withdrawHistory=[];if(!currentUser.aviatorHistory)currentUser.aviatorHistory=[];showDash();}}catch(e){}}
function startListener(){if(!currentUser||unsub)return;unsub=db.collection('users').doc(currentUser.phone).onSnapshot(s=>{if(!s.exists)return;const fb=s.data();if(JSON.stringify(fb)!==JSON.stringify(currentUser)){currentUser=fb;renderDash();}});}
function logout(){['diamond_current_glass_v20','diamond_current_glass_v19','diamond_current_glass_v18','diamond_current_glass_fixed_v17','diamond_current_v4'].forEach(k=>localStorage.removeItem(k));if(unsub){unsub();unsub=null;}location.reload();}
window.addEventListener('load',loadCurrent);
</script>
