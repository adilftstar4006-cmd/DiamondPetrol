// AVIATOR FAIR GAME LOGIC - NOT RIGGED
let avGame={isFlying:false,mult:1.0,crash:0,bet:0,betPlaced:false,interval:null,planeX:20,planeY:40};
function initAviator(){avGame={isFlying:false,mult:1.0,crash:0,bet:0,betPlaced:false,interval:null,planeX:20,planeY:40};updateAvUI();}
function generateFairCrash(){
// Fair crash: 97% RTP, using inverse transform - typical aviator: crash = 0.97 / (1 - r) with cap, but ensure 1.0 min, distribution where many crash 1-2x, few go high
// r = random 0-1
// This is FAIR - not rigged to make lose after win
const r=Math.random();
let crash=0.97/(1-r*0.97); // 97% RTP fair
if(crash<1)crash=1+Math.random()*0.2;
if(crash>50)crash=50+Math.random()*50; // cap max occasional 100x
// Add small chance of instant crash 1.00x ~3%
if(Math.random()<0.03)crash=1.00;
return Math.round(crash*100)/100;
}
function placeAviatorBet(){
 if(avGame.isFlying){toast('Game already flying - wait','err');return;}
 const bet=Number(document.getElementById('avBet')?.value||0);
 if(!bet||bet<10){toast('Min bet Rs 10 virtual','err');return;}
 if(bet>(currentUser.aviatorBalance||0)){toast('Insufficient aviator balance Rs '+(currentUser.aviatorBalance||0),'err');return;}
 if(bet>1000){toast('Max bet Rs 1000 for demo','err');return;}
 const crash=generateFairCrash();
 avGame={isFlying:true,mult:1.0,crash:crash,bet:bet,betPlaced:true,planeX:20,planeY:40};
 document.getElementById('avBetBtn').disabled=true;document.getElementById('avBetBtn').textContent='FLYING...';document.getElementById('avCashBtn').disabled=false;document.getElementById('avCashBtn').style.background='linear-gradient(90deg,#34d399,#00d2ff)';document.getElementById('avCashBtn').style.color='#000';
 document.getElementById('avStatus').textContent='FLYING • Crash @ '+crash.toFixed(2)+'x (hidden)';
 // deduct bet
 currentUser.aviatorBalance=(currentUser.aviatorBalance||500)-bet;
 // start flying
 let start=Date.now();
 avGame.interval=setInterval(()=>{
  const elapsed=(Date.now()-start)/1000;
  // multiplier growth: 1 + 0.06*elapsed^1.2 approx exponential
  avGame.mult=1+Math.pow(elapsed,1.15)*0.15;
  avGame.mult=Math.round(avGame.mult*100)/100;
  avGame.planeX=20+elapsed*35;
  avGame.planeY=40+elapsed*18;
  if(avGame.planeX>85)avGame.planeX=85;
  if(avGame.planeY>75)avGame.planeY=75;
  updateAvUI();
  // auto cashout check
  const auto=Number(document.getElementById('avAuto')?.value||0);
  if(auto>=1.1 && avGame.mult>=auto && avGame.betPlaced){cashoutAviator(true);}
  // crash check
  if(avGame.mult>=avGame.crash){
   crashAviator();
  }
 },80);
}
function updateAvUI(){
 const plane=document.getElementById('avPlane');const mult=document.getElementById('avMult');const line=document.getElementById('avLine');const info=document.getElementById('avInfo');
 if(!plane||!mult)return;
 plane.style.left=avGame.planeX+'%';plane.style.bottom=avGame.planeY+'px';
 mult.textContent=avGame.mult.toFixed(2)+'x';
 line.style.width=avGame.planeX+'%';
 if(avGame.isFlying){
  mult.className='multiplier flying';
  if(info)info.textContent='Bet Rs '+avGame.bet+' • Crash random @ '+avGame.crash.toFixed(2)+'x • Cashout before crash!';
 }else{
  if(avGame.crash>=1){
   mult.className='multiplier '+(avGame.mult>=avGame.crash?'crashed':'flying');
  }
 }
}
function cashoutAviator(isAuto=false){
 if(!avGame.isFlying||!avGame.betPlaced)return;
 clearInterval(avGame.interval);
 const win=Math.floor(avGame.bet*avGame.mult);
 const profit=win-avGame.bet;
 currentUser.aviatorBalance=(currentUser.aviatorBalance||0)+win;
 avGame.isFlying=false;avGame.betPlaced=false;
 const hist={crash:avGame.crash,bet:avGame.bet,mult:avGame.mult,win:win,profit:profit,won:true,time:Date.now()};
 currentUser.aviatorHistory=[...(currentUser.aviatorHistory||[]),hist].slice(-30);
 // save to firebase
 db.collection('users').doc(currentUser.phone).update({aviatorBalance:currentUser.aviatorBalance,aviatorHistory:currentUser.aviatorHistory}).catch(()=>{});
 document.getElementById('avBetBtn').disabled=false;document.getElementById('avBetBtn').textContent='PLACE BET • FLY ✈️';
 document.getElementById('avCashBtn').disabled=true;document.getElementById('avCashBtn').style.background='rgba(255,255,255,.06)';document.getElementById('avCashBtn').style.color='rgba(255,255,255,.3)';
 document.getElementById('avStatus').textContent='WON '+win+' @ '+avGame.mult.toFixed(2)+'x';
 document.getElementById('avInfo').textContent=(isAuto?'AUTO CASHOUT ':'CASHOUT ')+avGame.mult.toFixed(2)+'x • Win Rs '+win+' • Profit Rs '+profit+' • Balance Rs '+currentUser.aviatorBalance;
 toast((isAuto?'Auto ':'')+'Cashout '+avGame.mult.toFixed(2)+'x • Win Rs '+win+' • Profit '+profit,'ok');
 renderDash();
 setTimeout(()=>{avGame.mult=1.0;avGame.planeX=20;avGame.planeY=40;updateAvUI();},1200);
}
function crashAviator(){
 clearInterval(avGame.interval);
 avGame.isFlying=false;avGame.betPlaced=false;
 const hist={crash:avGame.crash,bet:avGame.bet,mult:avGame.crash,win:0,profit:-avGame.bet,won:false,time:Date.now()};
 currentUser.aviatorHistory=[...(currentUser.aviatorHistory||[]),hist].slice(-30);
 db.collection('users').doc(currentUser.phone).update({aviatorBalance:currentUser.aviatorBalance,aviatorHistory:currentUser.aviatorHistory}).catch(()=>{});
 document.getElementById('avMult').textContent=avGame.crash.toFixed(2)+'x';
 document.getElementById('avMult').className='multiplier crashed';
 document.getElementById('avBetBtn').disabled=false;document.getElementById('avBetBtn').textContent='PLACE BET • FLY ✈️';
 document.getElementById('avCashBtn').disabled=true;document.getElementById('avCashBtn').style.background='rgba(255,255,255,.06)';document.getElementById('avCashBtn').style.color='rgba(255,255,255,.3)';
 document.getElementById('avStatus').textContent='CRASHED @ '+avGame.crash.toFixed(2)+'x';
 document.getElementById('avInfo').textContent='💥 CRASHED @ '+avGame.crash.toFixed(2)+'x • Lost Rs '+avGame.bet+' • Balance Rs '+currentUser.aviatorBalance+' • Fair RNG';
 toast('Crashed @ '+avGame.crash.toFixed(2)+'x • Lost Rs '+avGame.bet+' • Fair game','err');
 renderDash();
 setTimeout(()=>{avGame.mult=1.0;avGame.planeX=20;avGame.planeY=40;updateAvUI();},1500);
}

async function investPlan(a,n,d){if(isProcessing)return;if(currentUser.balance<a){toast('Insufficient Rs '+currentUser.balance,'err');return;}if(!confirm('Invest Rs '+a+' in '+n+'? Daily Rs '+d))return;isProcessing=true;try{const nb=currentUser.balance-a;const ni=(currentUser.totalDeposit||0)+a;const na=[...(currentUser.activeInvests||[]),{id:Date.now().toString(),planId:PLANS.find(p=>p.price===a)?.id||1,planName:n,investAmount:a,amount:a,dailyProfit:d,daily:d,startDate:Date.now(),lastClaimDate:Date.now()-60000,totalClaimed:0,daysCompleted:0,status:'active'}];await db.collection('users').doc(currentUser.phone).update({balance:nb,totalDeposit:ni,totalInvested:ni,activeInvests:na});currentUser.balance=nb;currentUser.totalDeposit=ni;currentUser.activeInvests=na;renderDash();toast('Invested Rs '+a+' in '+n,'ok');}catch(e){toast(e.message,'err');}finally{isProcessing=false;}}
