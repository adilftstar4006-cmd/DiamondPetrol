function calcWd(){const a=Number(document.getElementById('wdAmount')?.value||0);const fee=Math.ceil(a*0.05);const rec=a-fee;const f=document.getElementById('wdFee');const r=document.getElementById('wdReceive');if(f)f.textContent='RS '+fee.toFixed(2);if(r)r.textContent='RS '+rec.toFixed(2);}
function filterHistory(type,btn){document.querySelectorAll('.history-tab').forEach(b=>{b.style.background='transparent';b.style.color='#f59e0b';b.style.border='1px solid rgba(245,158,11,.3)'});btn.style.background='#f59e0b';btn.style.color='#000';btn.style.border='none';const list=document.getElementById('historyList');const tx=(currentUser.transactions||[]);let filtered=tx;if(type!=='all')filtered=tx.filter(t=>t.type===type||(type==='profit'&&(t.type==='profit'||t.type==='daily'))||(type==='referral'&&t.type==='referral'));if(filtered.length===0){list.innerHTML=`<div style="text-align:center;padding:40px 20px"><div style="font-size:40px;opacity:.2">📥</div><div style="margin-top:10px;color:rgba(255,255,255,.4)">No ${type} transactions found</div></div>`;}else{list.innerHTML=filtered.slice().reverse().map(t=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)"><div><div style="font-size:12px;font-weight:600">${t.desc||t.type}</div><div style="font-size:10px;color:rgba(255,255,255,.4)">${new Date(t.date).toLocaleString()} • ${t.status||'approved'}</div></div><div style="font-weight:700;color:${t.type==='deposit'||t.type==='bonus'||t.type==='profit'?'#34d399':'#f87171'}">RS ${t.amount}</div></div>`).join('');}}
async function investPlan(a,n,d){if(isProcessing)return;if(currentUser.balance<a){toast('Insufficient RS '+currentUser.balance,'err');return;}if(!confirm('Invest RS '+a+' in '+n+'? Daily RS '+d))return;isProcessing=true;try{const nb=currentUser.balance-a;const ni=(currentUser.totalDeposit||0)+a;const na=[...(currentUser.activeInvests||[]),{id:Date.now().toString(),planId:PLANS.find(p=>p.price===a)?.id||1,planName:n,amount:a,daily:d,dailyProfit:d,startDate:Date.now(),lastClaimDate:Date.now()-60000,totalClaimed:0,daysCompleted:0,status:'active'}];const tx={type:'invest',amount:a,desc:'Invest '+n, date:new Date().toISOString(),status:'approved'};await db.collection('users').doc(currentUser.phone).update({balance:nb,totalDeposit:ni,activeInvests:na,transactions:firebase.firestore.FieldValue.arrayUnion(tx)});currentUser.balance=nb;currentUser.totalDeposit=ni;currentUser.activeInvests=na;currentUser.transactions=[...(currentUser.transactions||[]),tx];renderApp();toast('Invested RS '+a+' in '+n,'ok');}catch(e){toast(e.message,'err');}finally{isProcessing=false;}}
async function claimOne(id){if(isProcessing)return;const inv=currentUser.activeInvests.find(i=>i.id===id);if(!inv)return;isProcessing=true;try{const p=inv.daily||0;const nb=currentUser.balance+p;const ne=(currentUser.totalEarning||0)+p;const na=currentUser.activeInvests.map(i=>i.id===id?{...i,totalClaimed:(i.totalClaimed||0)+p,daysCompleted:(i.daysCompleted||0)+1,lastClaimDate:Date.now()}:i);const tx={type:'profit',amount:p,desc:'Daily profit '+inv.planName, date:new Date().toISOString(),status:'approved'};await db.collection('users').doc(currentUser.phone).update({balance:nb,totalEarning:ne,activeInvests:na,transactions:firebase.firestore.FieldValue.arrayUnion(tx)});currentUser.balance=nb;currentUser.totalEarning=ne;currentUser.activeInvests=na;currentUser.transactions=[...(currentUser.transactions||[]),tx];renderApp();toast('Claimed RS '+p,'ok');}catch(e){toast(e.message,'err');}finally{isProcessing=false;}}
function submitDeposit(){const a=document.getElementById('depAmount')?.value;const n=document.getElementById('depName')?.value;if(!a||!n){toast('Fill amount and name','err');return;}if(Number(a)<500){toast('Min 500','err');return;}const tx={type:'deposit',amount:Number(a),desc:'Deposit via '+ (document.getElementById('depMethod')?.value||'Easypaisa')+' - Pending', date:new Date().toISOString(),status:'pending'};db.collection('users').doc(currentUser.phone).update({transactions:firebase.firestore.FieldValue.arrayUnion(tx)}).then(()=>{currentUser.transactions=[...(currentUser.transactions||[]),tx];toast('Deposit RS '+a+' submitted • Pending approval','ok');switchPage('history');}).catch(e=>toast(e.message,'err'));}
async function submitWithdraw(){
 const amount=Number(document.getElementById('wdAmount')?.value||0);const method=document.getElementById('wdMethod')?.value;const acc=document.getElementById('wdAccount')?.value.trim();
 if(!amount||amount<500){toast('Min 500','err');return;}if(amount>currentUser.balance){toast('Insufficient','err');return;}if(!acc||acc.length<8){toast('Account number required','err');return;}
 if(!confirm('Withdraw RS '+amount+' to '+acc+'? Fee 5%'))return;
 try{const fee=Math.ceil(amount*0.05);const receive=amount-fee;const wd={id:Date.now().toString(),amount:amount,fee:fee,receive:receive,method:method,account:acc,status:'pending',date:new Date().toISOString()};const tx={type:'withdraw',amount:amount,desc:'Withdraw to '+method+' '+acc+' - Pending', date:new Date().toISOString(),status:'pending'};const newBal=currentUser.balance-amount;await db.collection('users').doc(currentUser.phone).update({balance:newBal,totalWithdraw:(currentUser.totalWithdraw||0)+amount,transactions:firebase.firestore.FieldValue.arrayUnion(tx)});currentUser.balance=newBal;currentUser.totalWithdraw=(currentUser.totalWithdraw||0)+amount;currentUser.transactions=[...(currentUser.transactions||[]),tx];toast('Withdraw RS '+amount+' requested • Pending • You get RS '+receive,'ok');renderApp();}catch(e){toast(e.message,'err');}
}
async function loadCurrent(){const p=localStorage.getItem('diamond_current_glass_v21');if(!p)return;try{const d=await db.collection('users').doc(p).get();if(d.exists){currentUser=d.data();showApp();}}catch(e){}}
function startListener(){if(!currentUser||unsub)return;unsub=db.collection('users').doc(currentUser.phone).onSnapshot(s=>{if(!s.exists)return;const fb=s.data();if(JSON.stringify(fb)!==JSON.stringify(currentUser)){currentUser=fb;renderApp();}});}
function logout(){localStorage.removeItem('diamond_current_glass_v21');if(unsub){unsub();unsub=null;}location.reload();}
window.addEventListener('load',loadCurrent);
