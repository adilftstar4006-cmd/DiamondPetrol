.field-row .icon{width:20px;height:20px;display:grid;place-items:center;flex-shrink:0;font-size:14px;opacity:.8;color:#fff}

.field-row input::placeholder{color:rgba(255,255,255,.55) !important;font-weight:300}
/* MOST IMPORTANT - FIX WHITE GLITCH */
.field-row input:-webkit-autofill,
.field-row input:-webkit-autofill:hover,
.field-row input:-webkit-autofill:focus,
.field-row input:-webkit-autofill:active{
  -webkit-box-shadow:0 0 0px 1000px transparent inset !important;
  -webkit-text-fill-color:#fff !important;
  -webkit-background-clip:text !important;
  background-color:transparent !important;
  background:transparent !important;
  transition:background-color 5000s ease-in-out 0s !important;
  caret-color:#fff;
}
.options{display:flex;justify-content:space-between;align-items:center;margin:16px 0 22px;font-size:12px}

.login-btn{width:100%;padding:14px;border:none;border-radius:999px;background:linear-gradient(135deg,#1a0b2e 0%,#3a1a5a 30%,#4a4a9a 70%,#6a8aff 100%);color:#fff;font-weight:600;font-size:12px;letter-spacing:2px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:.3s}

.msg{padding:10px 12px;border-radius:10px;font-size:11px;margin-bottom:14px;display:none;text-align:center}
.msg.show{display:block}
.msg.err{background:rgba(255,80,100,.15);border:1px solid rgba(255,80,100,.3);color:#ffb0b8}
.msg.ok{background:rgba(100,255,180,.12);border:1px solid rgba(100,255,180,.25);color:#8effc0}
.form{display:none}

.footer{text-align:center;margin-top:18px;font-size:9px;color:rgba(255,255,255,.3);letter-spacing:1px}

.d-logo-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#00d2ff,#7b2ff7);display:grid;place-items:center;color:#fff;font-size:14px}
.d-wrap{max-width:1200px;margin:0 auto;padding:20px}
.card{background:#151a2f;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px}
.card:hover{border-color:rgba(123,47,247,.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script>

function norm(p){if(!p)return'';p=p.trim().replace(/\s|-/g,'');if(p.startsWith('+92'))p='0'+p.slice(3);if(p.startsWith('92')&&p.length>=11)p='0'+p.slice(2);return p;}
function valid(p){return /^03[0-9]{9}$/.test(p);}
function switchTab(t){document.getElementById('loginForm').classList.toggle('active',t==='login');document.getElementById('signupForm').classList.toggle('active',t==='signup');showMsg('','');}
function showMsg(txt,type){const el=document.getElementById('msg');if(!txt){el.classList.remove('show');el.textContent='';return;}el.textContent=txt;el.className='msg show '+type;}
function switchDash(t){currentDash=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+t)?.classList.add('active');renderDash();}

async function doSignup(){
  const name=document.getElementById('signupName').value.trim();
  const raw=document.getElementById('signupPhone').value.trim();
  const pass=document.getElementById('signupPass').value;
  const ref=document.getElementById('signupRef').value.trim().toUpperCase();
  const btn=document.getElementById('signupBtn');const txt=document.getElementById('signupTxt');
  if(!name){showMsg('Full name required - adil','err');return;}
  const phone=norm(raw);
  if(!valid(phone)){showMsg('Phone: 03313394007 (11 digits)','err');return;}
  if(!pass||pass.length<6){showMsg('Password min 6','err');return;}
  btn.disabled=true;txt.textContent='Creating...';showMsg('Checking Firebase...','ok');
  try{
    const doc=await db.collection('users').doc(phone).get();
    if(doc.exists){showMsg('Phone already registered → Login','err');btn.disabled=false;txt.textContent='CREATE ACCOUNT + Rs 500';return;}
    const id=Date.now().toString();
    const code='DIAMOND'+phone.slice(-4)+Math.floor(Math.random()*90+10);
    // old local storage compatibility
    const oldUsers = JSON.parse(localStorage.getItem('diamond_users_v4')||'[]');
    const nu={id:id,phone:phone,username:name,email:phone+'@diamond.local',fullName:name,password:pass,referralCode:code,referredBy:ref,balance:500,totalDeposit:0,totalEarning:0,totalInvested:0,totalEarned:0,referralsCount:0,referralEarnings:0,kycStatus:'not_submitted',activeInvests:[],transactions:[{type:'bonus',amount:500,desc:'Welcome bonus',date:new Date().toISOString()}],createdAt:new Date().toISOString(),lastSync:firebase.firestore.FieldValue.serverTimestamp()};
    await db.collection('users').doc(phone).set(nu);
    // also save to old local for your code compatibility
    oldUsers.push({id:id,username:name,email:phone+'@diamond.local',password:pass,referralCode:code,referredBy:ref,balance:500,totalDeposit:0,totalEarning:0,referralsCount:0,referralEarnings:0,kycStatus:'not_submitted',activeInvests:[]});
    localStorage.setItem('diamond_users_v4',JSON.stringify(oldUsers));
    localStorage.setItem('diamond_current_v4',id);
    localStorage.setItem('diamond_current_glass_fixed_v17',phone);
    currentUser=nu;
    showMsg('Created + Rs 500! Loading dashboard...','ok');txt.textContent='Success';setTimeout(()=>showDash(),800);
  }catch(e){showMsg(e.message,'err');btn.disabled=false;txt.textContent='CREATE ACCOUNT + Rs 500';}
}

async function doLogin(){
  const raw=document.getElementById('loginPhone').value.trim();
  const pass=document.getElementById('loginPass').value;
  const btn=document.getElementById('loginBtn');const txt=document.getElementById('loginTxt');
  if(!raw||!pass){showMsg('Phone and password required','err');return;}
  const phone=norm(raw);
  if(!valid(phone)){showMsg('Valid phone: 03313394007','err');return;}
  btn.disabled=true;txt.textContent='Checking...';showMsg('Querying Firebase...','ok');
  try{
    const doc=await db.collection('users').doc(phone).get();
    if(!doc.exists){showMsg('User not found → Signup','err');btn.disabled=false;txt.textContent='LOGIN';return;}
    const fb=doc.data();
    if(fb.password!==pass){showMsg('Wrong password','err');btn.disabled=false;txt.textContent='LOGIN';return;}
    localStorage.setItem('diamond_current_glass_fixed_v17',phone);
    localStorage.setItem('diamond_current_v4',fb.id||phone);
    currentUser=fb;
    showMsg('Welcome '+fb.fullName+'!','ok');txt.textContent='Success';setTimeout(()=>showDash(),600);
  }catch(e){showMsg(e.message,'err');btn.disabled=false;txt.textContent='LOGIN';}
}

function showDash(){
  if(!currentUser)return;
  document.getElementById('auth').style.display='none';
  document.getElementById('dash').classList.add('active');
  document.getElementById('dashName').textContent=currentUser.fullName||currentUser.username||'User';
  document.getElementById('dashPhone').textContent=currentUser.phone;
  renderDash();
  startListener();
}

  const wrap=document.getElementById('dashContent');
  if(!currentUser)return;

  if(currentDash==='dashboard'){

        <div class="card"><div style="font-size:10px;color:rgba(255,255,255,.4);letter-spacing:1px">🎁 TODAY CLAIMABLE</div><div style="font-size:22px;font-weight:700;margin-top:6px;color:#34d399">Rs ${claimable.toLocaleString()}</div><div style="font-size:11px;color:rgba(255,255,255,.4)">${activeCount} plans ready • 1m=1day demo</div></div>
      </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px">
            ${(currentUser.activeInvests||[]).filter(i=>i.status!=='principal_returned').map(i=>`
              <div style="background:#0a0e1f;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px">

async function investPlan(amount,name,daily){
  if(currentUser.balance<amount){alert('Insufficient balance: Rs '+currentUser.balance);return;}
  if(!confirm('Invest Rs '+amount+' in '+name+'?'))return;
  try{
    const newBal=currentUser.balance-amount;
    const newInv=(currentUser.totalDeposit||currentUser.totalInvested||0)+amount;
    const newActive=[...(currentUser.activeInvests||[]),{id:Date.now().toString(),userId:currentUser.id||currentUser.phone,planId:PLANS.find(p=>p.price===amount)?.id||1,planName:name,investAmount:amount,amount:amount,dailyProfit:daily,daily:daily,startDate:Date.now(),lastClaimDate:Date.now()-60000,totalClaimed:0,daysCompleted:0,status:'active'}];
    await db.collection('users').doc(currentUser.phone).update({balance:newBal,totalDeposit:newInv,totalInvested:newInv,activeInvests:newActive});
    currentUser.balance=newBal;currentUser.totalDeposit=newInv;currentUser.activeInvests=newActive;
    renderDash();
    alert('Invested Rs '+amount+' in '+name+' - Daily Rs '+daily);
  }catch(e){alert(e.message);}
}

async function claimOne(id){
  const inv=currentUser.activeInvests.find(i=>i.id===id);
  if(!inv)return;
  const profit=inv.dailyProfit||inv.daily||0;
  try{
    const newBal=currentUser.balance+profit;
    const newEarn=(currentUser.totalEarning||currentUser.totalEarned||0)+profit;
    const newActive=currentUser.activeInvests.map(i=>i.id===id?{...i,totalClaimed:(i.totalClaimed||0)+profit,daysCompleted:(i.daysCompleted||0)+1,lastClaimDate:Date.now()}:i);
    await db.collection('users').doc(currentUser.phone).update({balance:newBal,totalEarning:newEarn,totalEarned:newEarn,activeInvests:newActive});
    currentUser.balance=newBal;currentUser.totalEarning=newEarn;currentUser.activeInvests=newActive;
    renderDash();
    alert('Claimed Rs '+profit);
  }catch(e){alert(e.message);}
}

async function submitDeposit(){
  const amount=document.getElementById('depAmount')?.value;
  const name=document.getElementById('depName')?.value;
  if(!amount||!name){alert('Fill amount and name');return;}
  alert('Deposit Rs '+amount+' submitted - pending approval - JazzCash 03134823393 - Firebase will sync to admin');
}

async function loadCurrent(){
  const phone=localStorage.getItem('diamond_current_glass_fixed_v17')||localStorage.getItem('diamond_current_glass_fixed');
  if(!phone)return;
  try{const doc=await db.collection('users').doc(phone).get(); if(doc.exists){currentUser=doc.data();showDash();}}catch(e){}
}

function startListener(){
  if(!currentUser||unsub)return;
  unsub=db.collection('users').doc(currentUser.phone).onSnapshot(snap=>{
    if(!snap.exists)return;
    const fb=snap.data();
    if(fb.balance!==currentUser.balance){
      currentUser=fb;
      renderDash();
    }
  });
}

function logout(){localStorage.removeItem('diamond_current_glass_fixed_v17');localStorage.removeItem('diamond_current_glass_fixed');if(unsub){unsub();unsub=null;}location.reload();}

window.addEventListener('load',loadCurrent);
