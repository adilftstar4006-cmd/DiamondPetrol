<!DOCTYPE html>
<html lang="en">
<head>
<!-- Firebase SDK for adiimei.online - User data save hoga -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script>
// Firebase Config for adiimei.online
const firebaseConfig = {
  apiKey: "AIzaSyBqYWKUXYDo8y-X7kLCuzldF_UKVht04",
  authDomain: "adiimei-invest.firebaseapp.com",
  projectId: "adiimei-invest",
  storageBucket: "adiimei-invest.firebasestorage.app",
  messagingSenderId: "383621463567",
  appId: "1:383621463567:web:5993d2528bdb88b7ed7a",
  measurementId: "G-3J3QBGZPL4"
};

// Initialize Firebase
let db = null;
let auth = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  console.log("✅ Firebase Connected for adiimei.online - User data ab save hoga!");
  
  // Enable offline persistence
  db.enablePersistence().catch((err) => {
    console.log("Persistence error:", err);
  });
} catch(e) {
  console.log("Firebase init error:", e);
}

// Helper functions to save user data to Firebase
window.saveUserToFirebase = async function(userData) {
  if(!db) return;
  try {
    await db.collection('users').doc(userData.email).set({
      fullName: userData.fullName,
      email: userData.email,
      balance: userData.balance || 0,
      totalEarned: userData.totalEarned || 0,
      referralCode: userData.referralCode,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastLogin: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge: true});
    console.log("User saved to Firebase:", userData.email);
  } catch(err) {
    console.log("Firebase save error:", err);
  }
};

window.saveDepositToFirebase = async function(depositData) {
  if(!db) return;
  try {
    await db.collection('deposits').add({
      ...depositData,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    console.log("Deposit saved to Firebase");
  } catch(err) {
    console.log("Deposit save error:", err);
  }
};

window.saveInvestmentToFirebase = async function(investmentData) {
  if(!db) return;
  try {
    await db.collection('investments').add({
      ...investmentData,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    console.log("Investment saved to Firebase");
  } catch(err) {
    console.log("Investment save error:", err);
  }
};
</script>
